# ── Global ───────────────────────────────────────────────
"$schema" = "https://starship.rs/config-schema.json"
add_newline = true

# ── Prompt format (two-line) ─────────────────────────────
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$status\
$golang\
$nodejs\
$python\
$rust\
$docker_context\
$line_break\
$character"""

# ── User & Host ─────────────────────────────────────────
[username]
show_always = false
style_user = "#d8caac bold"
format = "[$user]($style) "

[hostname]
ssh_only = false
format = "on [$hostname](bold #e68183) "
trim_at = "."
detect_env_vars = ['!TMUX', 'SSH_CONNECTION']

# ── Directory ────────────────────────────────────────────
[directory]
truncation_length = 3
truncation_symbol = ".../"
style = "bold #83b6af"
format = "in [$path]($style)[$read_only]($read_only_style) "

# ── Git ──────────────────────────────────────────────────
[git_branch]
format = "on [$symbol$branch]($style) "
style = "bold #d39bb6"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "bold #d9bb80"
conflicted = "~"
ahead = "+${count}"
behind = "-${count}"
diverged = "...${ahead_count}+${behind_count}-"
stashed = "$"

# ── Command duration & exit code ────────────────────────
[cmd_duration]
format = "took [$duration]($style) "
style = "bold #d9bb80"

[status]
disabled = false
format = "[$status]($style) "
style = "bold #e68183"
pipestatus = true
pipestatus_separator = "|"
pipestatus_format = "[$pipestatus]($style) "
pipestatus_segment_format = "$status"

# ── Language modules (only in project dirs) ──────────────
[golang]
format = "via [$symbol($version )]($style)"
style = "bold #87c095"
disabled = false
detect_files = ["go.mod"]

[nodejs]
format = "via [$symbol($version )]($style)"
style = "bold #87c095"
disabled = false
detect_files = ["package.json", ".node-version", "yarn.lock", "pnpm-lock.yaml"]

[python]
format = "via [${symbol}${version}]($style) "
style = "bold #87c095"
disabled = false
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", ".python-version", "setup.py"]
detect_folders = [".venv", "venv"]

[rust]
format = "via [$symbol($version )]($style)"
style = "bold #87c095"
disabled = false
detect_files = ["Cargo.toml"]

# ── Docker context ───────────────────────────────────────
[docker_context]
disabled = false
format = "via [$symbol$context]($style) "
style = "bold #83b6af"
only_with_files = true
detect_files = ["compose.yml", "compose.yaml", "docker-compose.yml", "docker-compose.yaml", "Dockerfile", "Dockerfile.dev"]
detect_folders = [".docker"]

# ── Prompt character ─────────────────────────────────────
[character]
success_symbol = "[>](bold #a7c080)"
error_symbol = "[>](bold #e68183)"
format = "$symbol "
