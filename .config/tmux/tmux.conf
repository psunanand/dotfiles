# ============================================= #
# CORE SERVER SETTINGS
# ============================================= #
# Set default terminal and enable true color support
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -sa terminal-features ',kitty:RGB'

set -g mouse off
set -s escape-time 0           # Eliminate Neovim 'Esc' lag
set -g history-limit 50000     # Increase scrollback for data processing
set -g focus-events on
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY WINDOWID XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE PATH"
set -g renumber-windows on     # Keep window numbering sequential
set -g status-interval 10      # Update status bar every 10 seconds
set -g repeat-time 750         # Keep repeatable key bindings active briefly
set -g base-index 1            # Start indexing at 1 (matches keyboard layout)
setw -g pane-base-index 1
set -g pane-active-border-style 'fg=#a7c080,bold'
set -g pane-border-style 'fg=#475258'
set -g pane-border-status top
set -g pane-border-format ' #{?window_zoomed_flag,#[fg=#323d43]#[bg=#d9bb80] ZOOMED #[default] ,}#{pane_index}: #{pane_title} '

set -g status-position top
set -g status-style 'bg=#323d43,fg=#d8caac'
set -g status-left '#[fg=#d9bb80,bold] #S #{?window_zoomed_flag,#[fg=#e68183] [Z] ,}'
set -g status-left-length 30
set -g status-right-length 100
set -g status-right '#[fg=#868d80]CPU:#[fg=#a7c080] #{cpu_percentage} #[fg=#505a60]│#[fg=#868d80] RAM:#[fg=#87c095] #{ram_percentage} #{?SSH_CLIENT,#[fg=#505a60]│#[fg=#868d80] %H:%M #[fg=#d9bb80]• #[fg=#d8caac]ssh:#h ,}#[fg=#505a60]│#[fg=#d9bb80]#{b:pane_current_path} '
# Activity is an amber dot, not a recolored window tab
setw -g window-status-format " #{?window_activity_flag,#[fg=#d9bb80]• #[fg=#868d80],}#I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style 'fg=#d9bb80,bg=#505a60,bold'
setw -g window-status-style 'fg=#868d80,bg=#323d43'
setw -g window-status-activity-style 'fg=#868d80,bg=#323d43'

# Customizing the separator between window tabs
setw -g window-status-separator ""

# Use the Nix system-profile Zsh, which nix-darwin registers in /etc/shells.
# Leave default-command unset so tmux launches this shell as a login shell.
set -g default-shell /run/current-system/sw/bin/zsh

# ============================================= #
# NAVIGATION & KEYBINDINGS
# ============================================= #
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Vi mode for copy/paste
set -g status-keys vi
set -g mode-keys vi

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux configuration"

# Path picker (inserts @path references for agent prompts into the active pane)
bind C-f display-popup -EE -w 80% -h 80% -d "#{pane_current_path}" -T "Find path" "$HOME/.config/tmux/scripts/path-picker.sh"

# Hard Kill: Prompt before destroying the entire session
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session

# Pane Splitting (Nvim style)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Tab Creation (Prefix + t)
bind t new-window -c "#{pane_current_path}"

# Seamlessly switch between Vim splits and Tmux panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane Resizing (Prefix + r, then repeatable vim directions)
bind r switch-client -T resize
bind -r -T resize h resize-pane -L 5
bind -r -T resize j resize-pane -D 5
bind -r -T resize k resize-pane -U 5
bind -r -T resize l resize-pane -R 5

# Renaming (Home-row friendly; preserve prefix + p for previous window)
bind n command-prompt -I "#W" "rename-window '%%'"
bind P command-prompt -I "#P" "select-pane -t -T '%%'"

# Toggle pane zoom (Maximize focus)
bind z resize-pane -Z

# Equalize panes (Balanced layout)
bind e select-layout tiled            # balanced grid
bind | select-layout even-horizontal  # equal side-by-side panes
bind - select-layout even-vertical    # equal stacked panes

# Move the current window left/right, keeping it focused
bind -r '{' swap-window -d -t -1
bind -r '}' swap-window -d -t +1

# Cycle the current pane backward/forward through the layout
bind -r '<' swap-pane -U
bind -r '>' swap-pane -D

# Session Management
bind S choose-tree -sZ
bind N new-session -c "#{pane_current_path}"

# ============================================= #
# ACTIVITY & MONITORING
# ============================================= #
setw -g monitor-activity on    # Highlight window in status bar on update
set -g visual-activity off     # Disable "Activity in window X" toast (distracting)
setw -g automatic-rename off   # Prevent shell commands from renaming your tabs

# ============================================= #
# PLUGINS (via TPM)
# ============================================= #
# Install with prefix + I

# TPM location
set -g @plugin 'tmux-plugins/tpm'
set -g @tpm-clean 'K'

# Plugin List
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Tmux-Yank Configuration
set -g @yank_selection_mouse 'clipboard'            # Primary clipboard

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'

# Vim-style copy mode; kept after TPM so these bindings override plugin defaults.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
