font_family family="JetBrainsMono Nerd Font Mono" style=Medium
font_size 16

shell_integration no-rc
hide_window_decorations yes

# Open links with Command-click, even when an app captures the mouse.
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press grabbed discard_event

include everforest.conf
